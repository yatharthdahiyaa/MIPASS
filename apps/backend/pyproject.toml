[project]
name = "mipaas-backend"
version = "0.2.0"
description = "MIPAAS — Medical Image Processing As A Software Service: API, accounts, patient EHR, doctor workstation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
