name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mipaas
          POSTGRES_PASSWORD: mipaas_dev_pass
          POSTGRES_DB: mipaas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mipaas -d mipaas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      MIPAAS_TEST_DATABASE_URL: postgresql://mipaas:mipaas_dev_pass@127.0.0.1:5432/mipaas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt
      - name: Install dependencies (CPU PyTorch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
      # Undefined names, unused imports and syntax errors fail the build; style is advisory.
      - name: Lint (errors only)
        run: ruff check . --select F,E9
      - name: Tests
        run: pytest -q
      - name: Migrations build the schema the models expect
        env:
          DATABASE_URL: postgresql://mipaas:mipaas_dev_pass@127.0.0.1:5432/mipaas_migrations
        run: |
          PGPASSWORD=mipaas_dev_pass psql -h 127.0.0.1 -U mipaas -d mipaas_test -c "CREATE DATABASE mipaas_migrations"
          alembic upgrade head
          alembic check

  agents:
    name: Agent test cases
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The care agents and their safety check need no model weights or imaging libraries.
      - run: pip install requests pytest ruff
      - run: ruff check CareAgents tests --select F,E9
      - run: pytest -q tests

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint src next.config.ts
      - run: npm run build

  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: UI type-check and build
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Rust checks
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
