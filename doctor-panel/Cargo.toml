[workspace]
members = [
    "crates/core",
    "crates/store",
    "crates/audit",
    "crates/infer",
    "crates/infer-worker",
    "crates/app",
]
resolver = "2"

[workspace.dependencies]
serde       = { version = "1.0.229", features = ["derive"] }
serde_json  = "1.0.154"
uuid        = { version = "1.29.0", features = ["v4", "serde"] }
chrono      = { version = "0.4.45", features = ["serde"] }
thiserror   = "2.0.21"
anyhow      = "1.0.104"
zeroize     = { version = "1.9.1", features = ["derive"] }
sha2        = "0.11.1"
hex         = "0.4.3"
argon2      = "0.6.0"
ed25519-dalek = "3.0.0"
rand        = "0.10.3"
tokio       = { version = "1.54.1", features = ["full"] }
log         = "0.4"
env_logger  = "0.11"

[profile.dev]
incremental = false
codegen-units = 1

[profile.test]
incremental = false
codegen-units = 1

[profile.release]
opt-level   = 3
lto         = "thin"
strip       = "debuginfo"
