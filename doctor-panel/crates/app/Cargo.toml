[package]
name    = "app"
version = "0.1.0"
edition = "2021"

[lib]
name              = "app_lib"
crate-type        = ["staticlib", "cdylib", "rlib"]

[dependencies]
doctor_core = { path = "../core", package = "doctor-core" }
store     = { path = "../store" }
audit     = { path = "../audit" }
infer     = { path = "../infer" }
serde     = { workspace = true }
serde_json= { workspace = true }
uuid      = { workspace = true }
chrono    = { workspace = true }
thiserror = { workspace = true }
anyhow    = { workspace = true }
argon2    = { workspace = true }
rand      = { workspace = true }
log       = { workspace = true }
env_logger= { workspace = true }
tokio     = { workspace = true }
tauri     = { version = "2.12.5", features = ["wry"] }
rusqlite  = { version = "0.41.0", features = ["bundled-sqlcipher"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
