[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mipaas-backend"
version = "0.1.0"
description = "Medical Image Processing As A Software Service — GCP Backend"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "MIPAAS Team"}
]

dependencies = [
    # Web framework
    "flask>=3.0,<4.0",
    "gunicorn>=22.0",
    "flask-cors>=5.0",
    
    # GCP SDKs
    "google-cloud-storage>=2.18",
    "google-cloud-pubsub>=2.23",
    "google-cloud-firestore>=2.19",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-logging>=3.11",
    "google-auth>=2.34",
    
    # Utilities & Database
    "pyyaml>=6.0",
    "marshmallow>=3.22",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "redis>=5.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
worker = [
    # Deep Learning
    "torch>=2.4",
    "torchvision>=0.19",
    "monai>=1.4",
    
    # Medical Imaging
    "pydicom>=3.0",
    "nibabel>=5.3",
    "SimpleITK>=2.4",
    "scikit-image>=0.24",
    "scipy>=1.14",
    
    # XAI
    "captum>=0.7",       # Integrated Gradients, Occlusion
    "shap>=0.46",
    
    # Visualization
    "matplotlib>=3.9",
    "Pillow>=10.4",
    "numpy>=1.26",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-flask>=1.3",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=app --cov=workers --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
